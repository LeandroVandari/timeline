[package]
name = "timeline_gui"
version = "0.1.0"
edition = "2024"
license-file.workspace = true

[dependencies]
bevy = { version = "0.19.0", default-features = false, features = ["2d"] }
temporal_rs = "0.2.3"
timeline_core = { path = "../timeline_core", features = ["date_iteration"] }
tracing = "0.1.44"
log = { version = "*", features = [
    "max_level_debug",
    "release_max_level_warn",
] }
bevy_drag = { version = "0.1.0", path = "../bevy_drag" }
query_ext = { version = "0.1.0", path = "../query_ext" }
bevy_zoom = { version = "0.1.0", path = "../bevy_zoom" }
bevy_wrap = { version = "0.1.0", path = "../bevy_wrap" }


[features]
debug = [
    "bevy/debug",
    "bevy/dynamic_linking",
    "bevy/bevy_dev_tools",
    "bevy/bevy_pbr",
    "bevy/ui",
]
wasm_website = []
profiling = ["bevy/trace", "bevy/debug", "bevy/trace_tracy"]
default = ["debug"]
