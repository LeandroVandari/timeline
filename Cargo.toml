[workspace]
resolver = "3"
members = ["timeline_cli", "timeline_core", "timeline_gui"]
package.license-file = "LICENSE"
package.repository = "https://github.com/LeandroVandari/timeline#"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[workspace.lints.clippy]
# "missing_errors_doc" = "warn"
# "missing_inline_in_public_items" = "warn"
# "missing_panics_doc" = "warn"
# "missing_docs_in_private_items" = "warn"
# unwrap_used = "warn"
print_stderr = "warn"
print_stdout = { level = "warn" }
# cargo_common_metadata = "warn"


doc_broken_link = "deny"
doc_link_with_quotes = "deny"
doc_markdown = "warn"
alloc_instead_of_core = "warn"
allow_attributes = "warn"
as_pointer_underscore = "deny"
as_underscore = "warn"
assigning_clones = "warn"
bool_to_int_with_if = "warn"
borrow_as_ptr = "deny"
case_sensitive_file_extension_comparisons = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_precision_loss = "warn"
cast_ptr_alignment = "deny"
cast_sign_loss = "warn"
checked_conversions = "warn"
clear_with_drain = "warn"
clone_on_ref_ptr = "warn"
cloned_instead_of_copied = "warn"
collapsible_else_if = "warn"
