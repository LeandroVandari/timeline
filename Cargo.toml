[workspace]
resolver = "3"
members = ["bevy_drag", "bevy_wrap", "bevy_zoom", "query_ext", "timeline_cli", "timeline_core", "timeline_gui"]
package.license-file = "LICENSE"
package.repository = "https://github.com/LeandroVandari/timeline#"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.wasm-release]
inherits = "release"
opt-level = "z"
